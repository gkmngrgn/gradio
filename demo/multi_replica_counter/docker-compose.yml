# 10-replica state-sync demo: Redis + 10 app replicas + round-robin nginx.
#
# Start (Docker daemon up, from the repo root):
#   docker compose -f demo/multi_replica_counter/docker-compose.yml up -d --build --scale app=10
# Check:
#   python demo/multi_replica_counter/sync_check.py --turns 20
# Stop:
#   docker compose -f demo/multi_replica_counter/docker-compose.yml down
#
# Session state only: this branch has no shared file backend yet (it lands
# with group 5 on feat/multi-replica-session-durability), so no file
# bucket or token is needed here.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      GRADIO_REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  lb:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
