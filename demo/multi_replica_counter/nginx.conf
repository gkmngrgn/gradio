# Round-robin over the scaled `app` service. The variable + internal
# resolver forces re-resolution per request so turns spread across all
# replicas instead of sticking to the first resolved IP.
resolver 127.0.0.11 valid=5s;

server {
    listen 8000;

    location / {
        set $backend app;
        proxy_pass http://$backend:7860;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
